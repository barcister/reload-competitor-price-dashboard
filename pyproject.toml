[project]
name = "phone-price-intel-mvp"
version = "0.2.0"
description = "Phone price intelligence and comparison platform MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.38",
  "psycopg[binary]>=3.2.5",
  "alembic>=1.15.0",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.8.1",
  "redis>=5.2.1",
  "httpx>=0.28.1",
  "python-json-logger>=2.0.7",
  "rapidfuzz>=3.12.1",
  "scrapy>=2.12.0",
  "scrapy-playwright>=0.0.41",
  "beautifulsoup4>=4.13.3",
  "lxml>=5.3.1",
  "boto3>=1.37.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = []
