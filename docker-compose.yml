version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: priceintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    env_file: .env
    depends_on: [postgres, redis]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.collector
    env_file: .env
    depends_on: [collector]
    command: ["python", "-m", "services.collector.app.runner"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
    ports: ["3000:3000"]
